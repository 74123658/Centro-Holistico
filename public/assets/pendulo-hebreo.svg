<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="pendBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF5EE"/>
      <stop offset="100%" stop-color="#EDE2CF"/>
    </linearGradient>
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C29468"/>
      <stop offset="50%" stop-color="#DEB887"/>
      <stop offset="100%" stop-color="#A57548"/>
    </linearGradient>
    <linearGradient id="crystalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#E8F4F8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#D0E8F2" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="pShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#pendBg)"/>

  <!-- Wooden Box with Star of David -->
  <g filter="url(#pShadow)">
    <rect x="460" y="80" width="220" height="260" rx="12" fill="url(#woodGrad)" stroke="#8C6239" stroke-width="2"/>
    <!-- Magen David / Star of David -->
    <polygon points="570,140 620,225 520,225" fill="none" stroke="#3A2814" stroke-width="5"/>
    <polygon points="570,250 620,165 520,165" fill="none" stroke="#3A2814" stroke-width="5"/>
  </g>

  <!-- Hebrew Pendulum Cylinder (Péndulo Hebreo de Cedro) -->
  <g filter="url(#pShadow)">
    <!-- Hanging cord -->
    <path d="M 230,60 C 210,100 240,140 230,190" fill="none" stroke="#4A341E" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Wooden Cylinder Body -->
    <rect x="170" y="190" width="130" height="220" rx="16" fill="url(#woodGrad)" stroke="#8C6239" stroke-width="2"/>
    
    <!-- White Paper Label with Hebrew Characters -->
    <rect x="170" y="240" width="130" height="120" fill="#FFFFFF" opacity="0.95"/>
    <line x1="170" y1="240" x2="300" y2="240" stroke="#B8860B" stroke-width="2"/>
    <line x1="170" y1="360" x2="300" y2="360" stroke="#B8860B" stroke-width="2"/>
    
    <!-- Hebrew letters: שפע (Shefa / Abundancia) -->
    <text x="235" y="295" font-family="serif" font-size="34" font-weight="bold" fill="#1C1C1C" text-anchor="middle">שפע</text>
    <text x="235" y="325" font-family="sans-serif" font-size="10" font-weight="bold" fill="#4A3820" text-anchor="middle" letter-spacing="1">ABUNDANCIA • SHEFA</text>
    <text x="235" y="345" font-family="sans-serif" font-size="8" fill="#7A6448" text-anchor="middle">IRRADIACIÓN ENERGÉTICA</text>

    <!-- Bottom Knot -->
    <circle cx="235" cy="415" r="8" fill="#4A341E"/>
  </g>

  <!-- Quartz Crystal Pendulum with Silver Chain -->
  <g filter="url(#pShadow)">
    <!-- Chain -->
    <path d="M 390,260 L 390,360" stroke="#A8A8A8" stroke-width="3" stroke-dasharray="3 3"/>
    <!-- Crystal Faceted Point -->
    <polygon points="390,360 415,390 415,440 390,490 365,440 365,390" fill="url(#crystalGrad)" stroke="#B0C4DE" stroke-width="1.5"/>
    <polygon points="390,360 415,390 390,490" fill="#FFFFFF" opacity="0.5"/>
    <!-- Sparkles -->
    <circle cx="395" cy="410" r="3" fill="#FFFFFF"/>
  </g>

  <!-- Label Badge -->
  <rect x="250" y="530" width="300" height="36" rx="18" fill="#3B2D19" opacity="0.9"/>
  <text x="400" y="553" font-family="sans-serif" font-size="13" font-weight="bold" fill="#F5EBD7" text-anchor="middle" letter-spacing="1">PÉNDULO HEBREO &amp; CIRUGÍA ENERGÉTICA</text>
</svg>
