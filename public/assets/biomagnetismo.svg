<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF5EE"/>
      <stop offset="100%" stop-color="#EDE2CF"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EED8C3"/>
      <stop offset="100%" stop-color="#DEC0A3"/>
    </linearGradient>
    <linearGradient id="redMagnet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E53935"/>
      <stop offset="100%" stop-color="#B71C1C"/>
    </linearGradient>
    <linearGradient id="blackMagnet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#424242"/>
      <stop offset="100%" stop-color="#1A1A1A"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Clinic Background Table & Linen -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <rect x="150" y="40" width="500" height="520" rx="30" fill="#FFFFFF" opacity="0.9" filter="url(#shadow)"/>
  <rect x="180" y="60" width="440" height="480" rx="20" fill="#F8F6F0" stroke="#E2D6C0" stroke-width="2"/>

  <!-- Patient Back & Neck (Silhouette lying face down) -->
  <path d="M 400,100 C 370,100 350,130 350,160 C 350,200 330,220 280,260 C 250,285 240,330 250,420 C 260,500 330,520 400,520 C 470,520 540,500 550,420 C 560,330 550,285 520,260 C 470,220 450,200 450,160 C 450,130 430,100 400,100 Z" fill="url(#skinGrad)" filter="url(#shadow)"/>

  <!-- Spine Alignment line subtle -->
  <path d="M 400,180 L 400,480" stroke="#CAA88A" stroke-width="2" stroke-dasharray="4 6" opacity="0.6"/>

  <!-- Biomagnetic Pair (Par Biomagnético) -->
  <!-- Red Magnet (Polo Positivo / Sur) on Left Scapula -->
  <g filter="url(#shadow)">
    <circle cx="330" cy="310" r="48" fill="url(#redMagnet)"/>
    <circle cx="330" cy="310" r="38" fill="none" stroke="#FFCDD2" stroke-width="3" opacity="0.7"/>
    <circle cx="330" cy="310" r="18" fill="#B71C1C" opacity="0.6"/>
    <!-- Magnet Tab -->
    <path d="M 285,300 C 275,300 270,305 270,310 C 270,315 275,320 285,320 Z" fill="#B71C1C"/>
    <text x="330" y="316" font-family="sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">+</text>
  </g>

  <!-- Black Magnet (Polo Negativo / Norte) on Right Scapula -->
  <g filter="url(#shadow)">
    <circle cx="470" cy="310" r="48" fill="url(#blackMagnet)"/>
    <circle cx="470" cy="310" r="38" fill="none" stroke="#757575" stroke-width="3" opacity="0.7"/>
    <circle cx="470" cy="310" r="18" fill="#111111" opacity="0.6"/>
    <!-- Magnet Tab -->
    <path d="M 515,300 C 525,300 530,305 530,310 C 530,315 525,320 515,320 Z" fill="#111111"/>
    <text x="470" y="316" font-family="sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">-</text>
  </g>

  <!-- Resonance Flux Wave between magnets -->
  <path d="M 378,310 C 400,285 400,335 422,310" fill="none" stroke="#C5A059" stroke-width="2.5" stroke-dasharray="3 3"/>

  <!-- Therapist Hands caring touch on shoulders -->
  <path d="M 240,220 C 260,200 290,210 310,230 C 315,235 310,245 295,245 C 275,245 250,235 240,220 Z" fill="#F3DFCD" opacity="0.85" filter="url(#shadow)"/>
  <path d="M 560,220 C 540,200 510,210 490,230 C 485,235 490,245 505,245 C 525,245 550,235 560,220 Z" fill="#F3DFCD" opacity="0.85" filter="url(#shadow)"/>

  <!-- Badge label -->
  <rect x="250" y="530" width="300" height="36" rx="18" fill="#3B2D19" opacity="0.9"/>
  <text x="400" y="553" font-family="sans-serif" font-size="13" font-weight="bold" fill="#F5EBD7" text-anchor="middle" letter-spacing="1">PAR BIOMAGNÉTICO CLÍNICO</text>
</svg>
